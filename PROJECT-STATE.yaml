project: Stella Core
version_target: "3.0 Alpha"
status: alpha-candidate-gate-implemented
updated_at: "2026-09-03"

mission:
  single_goal: >-
    Become the owner's increasingly accurate digital counterpart and
    high-dimensional self, then improve real-world judgment and action.

repositories:
  core:
    repo: tower1229/Stella-Core
    role: public OpenClaw plugin runtime, contracts, architecture, schemas, evaluation harness
  personal_data:
    repo: tower1229/CangHai
    role: private portable durable consciousness and personal data plane

recovery_invariant: >-
  A fresh compatible OpenClaw + Stella Core installation must be able to
  restore Stella core consciousness from one coherent CangHai revision and
  required external secrets without importing old OpenClaw sessions or
  machine-local runtime databases.

core_systems:
  - Personal Twin
  - Framework Compiler
  - Reality / Social Intelligence
  - Praxis Loop

runtime_strategy:
  host: OpenClaw
  target_host_version: "2026.8.2"
  minimum_claimed_host_version: "2026.8.1"
  integration: single stella-core plugin
  replace_agent_loop: false
  consciousness_manifest: 50_PersonalAgent/stella/manifest.yaml
  local_dev:
    isolated_openclaw_state: true
    linked_plugin_checkout: true
    canghai_base_branch: dev-stella-3-rebuild
    canghai_local_work_branch: local/stella-alpha
    initial_data_mode: read_only

