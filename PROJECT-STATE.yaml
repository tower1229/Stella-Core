settled_constraints:
  - one Cortex with four cooperating cognitive systems
  - personal data centralized in CangHai; current Git copy contains retained original bytes
  - reuse Host sessions, search infrastructure, models, tools, permissions and scheduling
  - structured LLM judgment for variable natural-language meaning
  - full contract success or explicit diagnosable failure
  - quality-first recall; material unknowns permit clarification
  - social judgment only when requested; other accepted autonomy remains
  - writing collaboration preserves authorial intent and unfinished thinking
  - prior explicit delegation remains usable within scope
  - no natural-language forgetting; owner file edits drive synchronization
  - immutable historical predictions and separately validated current understanding
  - actual usefulness comes from owner feedback, not a mandatory score
  - private data never enters public Core assets
