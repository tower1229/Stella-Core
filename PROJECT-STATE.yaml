project: Stella Core
version_target: "3.0 Alpha"
status: design-contracts-baselined-runtime-alignment-pending
updated_at: "2026-09-05"

mission: >-
  Become the owner's increasingly accurate digital counterpart and
  high-dimensional self, extending memory, experience, simulation and praxis.

normative_refs:
  requirements: docs/09-REQUIREMENTS-ALIGNMENT.md
  current_baseline: docs/10-DESIGN-BASELINE.md
  glossary: CONTEXT.md
  contracts: docs/contracts/README.md
  alpha_acceptance: docs/05-ALPHA-PLAN.md
  decisions: docs/DECISIONS.md

repositories:
  core:
    repo: tower1229/Stella-Core
    role: public plugin runtime, contracts, schemas and synthetic evaluation
  personal_data:
    repo: tower1229/CangHai
    role: private originals, portable learning and instance configuration
    legacy_backup_ref: dev
    verified_legacy_commit: a1c2f4ec444b7d3245a7a0afea74460470a5dfc2
    core_test_branch: local/stella-alpha
    runtime_revision: explicitly selected by instance; never inferred from these labels

runtime_strategy:
  host: OpenClaw
  target_host_version: "2026.8.2"
  minimum_claimed_host_version: "2026.8.1"
  minimum_version_independently_verified: false
  integration: single stella-core plugin
  replace_agent_loop: false
  completion_strategy: limited reply_dispatch adapter over Host Agent Loop; Exact Host proof required
  consciousness_manifest: 50_PersonalAgent/stella/manifest.yaml
  alpha_delivery_mode: managed_durable_write

design_complete:
  - document authority, response kinds, common gates and distinct Alpha/full-memory acceptance
  - versioned source identity, evidence provenance, original-data coverage and portable discovery
  - multi-round retrieval, source rereads, counterevidence, stopping and explicit failures
  - scoped interaction learning and OngoingWork independent of action outcomes
  - source-change synchronization, historical pins, current eligibility and failure recovery
  - Episode v2 state machine and machine schema
  - restore semantics for legal empty sets and optional unavailable capabilities
  - current Host seam review and required completion adapter contract

implementation_evidence:
  reviewed_runtime_commit: 22a9b91187e9966b2d5c0fba7a624a3a47eb5a52
  existing:
    - plugin scaffold, manifest and reference loading, Framework IR and Twin validation
    - managed commits, persistent recovery pointer CAS, push and bounded normal RPO diagnostics
    - existing Episode v1 recommendation/action/outcome path and immutable prediction checks
    - recovery, evaluation, private write-loop, activation and candidate receipt runners
    - 32 public synthetic relationship/social diagnostic cases
  new_contract_checks:
    - Episode v2 JSON Schema compilation and structural contract tests
  limit: >-
    Existing code and historical receipts do not certify the revised baseline.
    Full validators, migrations and exact-Host fault evidence remain necessary.

implementation_gaps:
  - response-kind routing and evaluation without mandatory action or prediction
  - Episode v2 one-time migration and matching runtime/store/runner support
  - generation-aware evidence and dependency synchronization across Core and Host views
  - full archive adapters, coverage, media materialization and retention coordination
  - OngoingWork and LearningChange persistence, application and idempotency
  - required completion adapter, cancellation and observable delivery failures
  - complete registry/profile validation and legal-empty recovery fixtures

settled_constraints:
  - one Cortex with four cooperating cognitive systems
  - personal data centralized in CangHai; current Git copy contains retained original bytes
  - reuse Host sessions, search infrastructure, models, tools, permissions and scheduling
  - structured LLM judgment for variable natural-language meaning
  - full contract success or explicit diagnosable failure
  - quality-first recall; material unknowns permit clarification
  - social judgment only when requested; other accepted autonomy remains
  - writing collaboration preserves authorial intent and unfinished thinking
  - prior explicit delegation remains usable within scope
  - no natural-language forgetting; owner file edits drive synchronization
  - immutable historical predictions and separately validated current understanding
  - actual usefulness comes from owner feedback, not a mandatory score
  - private data never enters public Core assets

scope_of_this_change:
  private_data_migrated: false
  runtime_activated: false
  candidate_certified: false
  publication_performed: false
