frozen_decisions:
  - one Cortex, not four persistent agents
  - Praxis is the primary product loop
  - Personal Twin is evaluated by pre-outcome prediction
  - CangHai carries durable Stella consciousness; Stella Core runtime is replaceable
  - old OpenClaw sessions are not required for consciousness recovery
  - one explicitly selected CangHai Git revision is the restore coherence boundary
  - repository default branch must never be inferred as the personal-data baseline or recovery revision
  - bootstrap/source baseline records derivation provenance; it is not a requirement that all later CangHai recovery revisions equal the original bootstrap commit
  - content-derived managed artifacts must pin source identity strongly enough to detect source drift before reuse
  - critical durable cognition must synchronize remotely; normal learning has explicit bounded RPO
  - owner framework source, compiled IR, and Praxis learning are separate
  - legacy Stella 1.0 corpus remains cold-start evidence and is not destructively migrated for Alpha
  - new 3.0 learning uses managed personal-data locations
  - recommendation does not imply action; acted requires external actual-action evidence
  - recovery pointer persistence occurs after commit and before remote synchronization
  - local development may use read_only or local_write, but Alpha delivery requires managed_durable_write
  - no personal fine-tuning required for Alpha
  - Stella-Core must contain no private CangHai data

