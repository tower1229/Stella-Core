implementation_gaps:
  - initialization Host bootstrap implements reviewed templates, behavior mapping, complete skill trees, setup and identity; full-memory and automation adapters and private main migration remain incomplete; see docs/04-OPENCLAW-INTEGRATION.md section 8.11
  - final clean candidate must rerun after current working-tree changes are committed
  - private instance adapter must provide the v2 four-turn harness and authorized evidence inputs
  - real-action learning and eligible next-turn use remain unverified; candidate strategy creation is insufficient
  - generation-aware evidence and dependency synchronization across Core and Host views
  - full archive adapters, coverage, media materialization and retention coordination
  - OngoingWork and LearningChange persistence, application and idempotency
  - remaining exact-Host replay, cancellation and fault coverage on one candidate artifact
  - complete registry/profile validation and required capability acceptance

settled_constraints:
  - one Cortex with four cooperating cognitive systems
  - personal data centralized in CangHai; current Git copy contains retained original bytes
  - reuse Host sessions, search infrastructure, models, tools, permissions and scheduling
  - structured LLM judgment for variable natural-language meaning
  - full contract success or explicit diagnosable failure
  - quality-first recall; material unknowns permit clarification
  - social judgment only when requested; other accepted autonomy remains
  - writing collaboration preserves authorial intent and unfinished thinking
  - prior explicit delegation remains usable within scope
  - no natural-language forgetting; owner file edits drive synchronization
  - immutable historical predictions and separately validated current understanding
  - actual usefulness comes from owner feedback, not a mandatory score
  - private data never enters public Core assets

